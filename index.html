<meta charset="UTF-8"><div class="modal" id="loginModal">
  <div class="modal-box">

    <h2 id="formTitle">تسجيل الدخول</h2>

    <input id="username" type="text" placeholder="اسم المستخدم">

    <input id="password" type="password" placeholder="كلمة المرور">

    <button class="submit" onclick="submitForm()">دخول</button>

    <div class="switch" onclick="switchForm()" id="switchText">
      إنشاء حساب جديد
    </div>

    <button class="close" onclick="closeLogin()">إغلاق</button>

  </div>
</div>

<script>
  let registerMode = false;

  function openLogin() {
    document.getElementById("loginModal").style.display = "flex";
  }

  function closeLogin() {
    document.getElementById("loginModal").style.display = "none";
  }

  function switchForm() {
  registerMode = !registerMode;

  document.getElementById("formTitle").textContent =
    registerMode ? "إنشاء حساب" : "تسجيل الدخول";

  document.querySelector(".submit").textContent =
    registerMode ? "إنشاء الحساب" : "دخول";

  document.getElementById("switchText").textContent =
    registerMode ? "لدي حساب بالفعل" : "إنشاء حساب جديد";
}

  function submitForm() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
      alert("يرجى إدخال اسم المستخدم وكلمة المرور");
      return;
    }

    if (registerMode) {
      localStorage.setItem("demoUser", username);
      alert("تم إنشاء الحساب تجريبيًا");
      switchForm();
    } else {
      const savedUser = localStorage.getItem("demoUser");

      if (savedUser === username) {
        alert("تم تسجيل الدخول بنجاح");
        closeLogin();
      } else {
        alert("الحساب غير موجود في النسخة التجريبية");
      }
    }
  }
</script>

</body>
</html>
